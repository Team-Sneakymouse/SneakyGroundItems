name: SneakyGroundItems
version: "${version}"
main: com.danidipp.sneakygrounditems.SneakyGroundItems
api-version: "26.2"
authors:
  - DaniDipp
description: "Dedicated Paper plugin for custom placed ground items"
permissions:
  sneakygrounditems.use:
    description: "Allows placing and interacting with ground items"
    default: false
dependencies:
  server:
    MagicSpells:
      load: BEFORE
      required: true
    WorldGuard:
      load: BEFORE
      required: false
    CoreProtect:
      load: BEFORE
      required: false
      join-classpath: true
    SneakyBagOfHolding:
      load: BEFORE
      required: false
      join-classpath: true
